<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dig Carrots!">
<title>Dig Carrots! - Word Game for Bobo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #4a90d9;
  touch-action: none;
  -webkit-touch-callout: none;

  overscroll-behavior: none;
}
canvas {
  display: block;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ============================================================
// CONFIGURATION (iPad: 4:3 aspect ratio, larger layout)
// ============================================================
const CONFIG = {
  W: 1024,
  H: 768,
  WORDS: [
    'VOLCANO','ROCK','MAGMA','LAVA','SLEEP','ERUPTION','HAND','JUMP',
    'KING','LAKE','MAKE','NAME','OPEN','PLAY','RAIN','SAND',
    'TAKE','UPON','VERY','WALK','BACK','COLD','DOOR','FAST',
    'GIRL','HELP','INTO','JUST','KEEP','LONG','MUCH','NEXT',
    'OVER','PICK','RIDE','SHIP','THEM','UNDER','WATER','PLANT',
    'ABOVE','BEGAN','BRING','CARRY','CLEAN','CLIMB','DRINK','EARTH',
    'EIGHT','FLOAT','GREEN','HAPPY','HOUSE','LEARN','LIGHT','MIGHT',
    'NORTH','ROUND','STORY','THINK'
  ],
  ROUNDS: 16,
  CARROTS_PER_ROUND: 4,
  ROUND_TIME: 10,
  RESULT_PAUSE: 2,
  VOWELS: 'AEIOU',
  ALL_LETTERS: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  MASKS_PER_WORD: 2
};

// ============================================================
// CANVAS SETUP
// ============================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = CONFIG.W;
canvas.height = CONFIG.H;

let scale = 1, offsetX = 0, offsetY = 0;

function resize() {
  const ww = window.innerWidth, wh = window.innerHeight;
  scale = Math.min(ww / CONFIG.W, wh / CONFIG.H);
  canvas.style.width = (CONFIG.W * scale) + 'px';
  canvas.style.height = (CONFIG.H * scale) + 'px';
  offsetX = (ww - CONFIG.W * scale) / 2;
  offsetY = (wh - CONFIG.H * scale) / 2;
  canvas.style.position = 'absolute';
  canvas.style.left = offsetX + 'px';
  canvas.style.top = offsetY + 'px';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));
resize();

// ============================================================
// AUDIO SYSTEM
// ============================================================
let audioCtx;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, dur, type = 'sine', vol = 0.1, slide = 0) {
  ensureAudio();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slide) o.frequency.linearRampToValueAtTime(freq + slide, audioCtx.currentTime + dur);
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + dur);
}

function sfxCorrect() {
  [523, 659, 784].forEach((f, i) => setTimeout(() => playTone(f, 0.2, 'sine', 0.12), i * 100));
}
function sfxWrong() {
  playTone(233, 0.2, 'triangle', 0.1);
  setTimeout(() => playTone(175, 0.3, 'triangle', 0.1), 100);
}
function sfxTimeout() {
  [300, 250, 180, 120].forEach((f, i) => setTimeout(() => playTone(f, 0.25, 'triangle', 0.08), i * 80));
}
function sfxDig() {
  playTone(150, 0.2, 'triangle', 0.1, -50);
}
function sfxPull() {
  playTone(300, 0.3, 'sine', 0.08, 400);
}
function sfxTick() {
  playTone(800, 0.05, 'sine', 0.06);
}
function sfxGameOver() {
  [392, 494, 587, 784, 587, 784, 1047].forEach((f, i) =>
    setTimeout(() => playTone(f, 0.25, 'sine', 0.1), i * 120));
}
function sfxStart() {
  [523, 659, 784, 1047].forEach((f, i) =>
    setTimeout(() => playTone(f, 0.15, 'sine', 0.1), i * 80));
}

function speakWord(word) {
  if ('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(word);
    utterance.rate = 0.85;
    utterance.pitch = 1.1;
    utterance.lang = 'en-US';
    speechSynthesis.speak(utterance);
  }
}

// ============================================================
// GAME STATE
// ============================================================
const STATE = { TITLE: 0, PLAYING: 1, ROUND_RESULT: 2, GAME_OVER: 3 };
let state = STATE.TITLE;
let score = 0;
let round = 0;
let roundTimer = 0;
let resultTimer = 0;
let wordOrder = [];
let currentWord = '';
let maskedIndices = [];
let revealedLetters = [];
let correctLetters = '';
let answered = false;
let carrots = [];
let particles = [];
let hoveredCarrot = -1;
let lastTickAt = -1;
let roundResult = '';

// Dig animation state
let digAnim = null;

// Celebration ribbons
let ribbons = [];
const RIBBON_COLORS = ['#FF6B6B','#FFD93D','#4ECDC4','#FF8C42','#A78BFA','#34D399','#F472B6','#60A5FA'];

function spawnRibbons() {
  ribbons = [];
  for (let i = 0; i < 40; i++) {
    ribbons.push({
      x: Math.random() * CONFIG.W,
      y: -20 - Math.random() * 400,
      vx: (Math.random() - 0.5) * 60,
      vy: 40 + Math.random() * 80,
      w: 8 + Math.random() * 10,
      h: 18 + Math.random() * 20,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 4,
      color: RIBBON_COLORS[Math.floor(Math.random() * RIBBON_COLORS.length)],
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 1.5 + Math.random() * 2
    });
  }
}

function updateRibbons(dt) {
  ribbons.forEach(r => {
    r.wobble += r.wobbleSpeed * dt;
    r.x += (r.vx + Math.sin(r.wobble) * 30) * dt;
    r.y += r.vy * dt;
    r.rot += r.rotV * dt;
    if (r.y > CONFIG.H + 30) {
      r.y = -20 - Math.random() * 40;
      r.x = Math.random() * CONFIG.W;
    }
  });
}

function drawRibbons() {
  ribbons.forEach(r => {
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.rotate(r.rot);
    ctx.fillStyle = r.color;
    ctx.beginPath();
    ctx.moveTo(-r.w / 2, -r.h / 2);
    ctx.quadraticCurveTo(r.w * 0.3, -r.h * 0.1, r.w / 2, -r.h / 2);
    ctx.lineTo(r.w / 2, r.h / 2);
    ctx.quadraticCurveTo(-r.w * 0.3, r.h * 0.1, -r.w / 2, r.h / 2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(-r.w / 4, -r.h / 2, r.w / 4, r.h);
    ctx.restore();
  });
}

// Pre-rendered background
let bgCanvas, bgCtx;

// Cloud positions
const clouds = [];
for (let i = 0; i < 6; i++) {
  clouds.push({ x: Math.random() * CONFIG.W, y: 100 + Math.random() * 160, w: 90 + Math.random() * 70 });
}

// Shovel position constants
const SHOVEL_REST_X = CONFIG.W / 2;
const SHOVEL_REST_Y = 130;

// Carrot Y position (lower on taller canvas)
const CARROT_Y = 560;

// ============================================================
// DRAWING UTILITIES
// ============================================================
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawCloud(cx, cy, w) {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  const h = w * 0.4;
  ctx.beginPath();
  ctx.ellipse(cx, cy, w * 0.5, h * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx - w * 0.25, cy + h * 0.1, w * 0.3, h * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + w * 0.25, cy + h * 0.05, w * 0.35, h * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawSun(x, y, r) {
  const grd = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 2);
  grd.addColorStop(0, 'rgba(255,255,100,0.4)');
  grd.addColorStop(1, 'rgba(255,255,100,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(x - r * 2, y - r * 2, r * 4, r * 4);
  ctx.fillStyle = '#FFD93D';
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(x - r * 0.25, y - r * 0.1, r * 0.08, 0, Math.PI * 2);
  ctx.arc(x + r * 0.25, y - r * 0.1, r * 0.08, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(x, y + r * 0.1, r * 0.2, 0, Math.PI);
  ctx.stroke();
}

// ============================================================
// BACKGROUND (pre-rendered)
// ============================================================
function renderBackground() {
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = CONFIG.W;
  bgCanvas.height = CONFIG.H;
  bgCtx = bgCanvas.getContext('2d');

  const c = bgCtx;
  // Sky — taller
  const skyGrd = c.createLinearGradient(0, 0, 0, 440);
  skyGrd.addColorStop(0, '#5BA3E6');
  skyGrd.addColorStop(1, '#87CEEB');
  c.fillStyle = skyGrd;
  c.fillRect(0, 0, CONFIG.W, 440);

  // Dirt
  const dirtGrd = c.createLinearGradient(0, 420, 0, CONFIG.H);
  dirtGrd.addColorStop(0, '#A0724A');
  dirtGrd.addColorStop(1, '#6B3F23');
  c.fillStyle = dirtGrd;
  c.fillRect(0, 420, CONFIG.W, CONFIG.H - 420);

  // Grass edge
  c.fillStyle = '#4CAF50';
  c.fillRect(0, 415, CONFIG.W, 14);
  c.fillStyle = '#66BB6A';
  for (let x = 0; x < CONFIG.W; x += 15) {
    c.beginPath();
    c.moveTo(x, 415);
    c.lineTo(x + 7, 400 - Math.random() * 10);
    c.lineTo(x + 14, 415);
    c.fill();
  }
  c.fillStyle = '#388E3C';
  for (let x = 7; x < CONFIG.W; x += 15) {
    c.beginPath();
    c.moveTo(x, 415);
    c.lineTo(x + 5, 405 - Math.random() * 7);
    c.lineTo(x + 10, 415);
    c.fill();
  }

  // Dirt texture
  c.fillStyle = 'rgba(0,0,0,0.06)';
  for (let i = 0; i < 50; i++) {
    const dx = Math.random() * CONFIG.W;
    const dy = 440 + Math.random() * (CONFIG.H - 460);
    const dr = 3 + Math.random() * 10;
    c.beginPath();
    c.arc(dx, dy, dr, 0, Math.PI * 2);
    c.fill();
  }
}

// ============================================================
// SHOVEL DRAWING
// ============================================================
function drawShovelBlade(cx, cy, bladeW, bladeH, angle) {
  ctx.save();
  ctx.translate(cx, cy);
  if (angle) ctx.rotate(angle);

  const topW = bladeW / 2;
  const botW = bladeW / 2 - 8;

  // Handle
  ctx.strokeStyle = '#8B6914';
  ctx.lineWidth = 13;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -bladeH / 2);
  ctx.lineTo(0, -bladeH / 2 - 100);
  ctx.stroke();
  ctx.strokeStyle = '#A0802A';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(3, -bladeH / 2 - 5);
  ctx.lineTo(3, -bladeH / 2 - 95);
  ctx.stroke();
  // T-grip
  ctx.strokeStyle = '#5A3A0A';
  ctx.lineWidth = 12;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-20, -bladeH / 2 - 98);
  ctx.lineTo(20, -bladeH / 2 - 98);
  ctx.stroke();

  // Collar
  ctx.fillStyle = '#999';
  ctx.strokeStyle = '#777';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  roundRect(-15, -bladeH / 2 - 5, 30, 12, 3);
  ctx.fillStyle = '#999';
  ctx.fill();
  ctx.strokeStyle = '#777';
  ctx.stroke();

  // Blade
  ctx.beginPath();
  ctx.moveTo(-topW, -bladeH / 2);
  ctx.lineTo(topW, -bladeH / 2);
  ctx.lineTo(botW, bladeH / 2 - 12);
  ctx.quadraticCurveTo(botW, bladeH / 2, botW - 12, bladeH / 2);
  ctx.lineTo(-botW + 12, bladeH / 2);
  ctx.quadraticCurveTo(-botW, bladeH / 2, -botW, bladeH / 2 - 12);
  ctx.lineTo(-topW, -bladeH / 2);
  ctx.closePath();

  const bladeGrd = ctx.createLinearGradient(0, -bladeH / 2, 0, bladeH / 2);
  bladeGrd.addColorStop(0, '#C8C8C8');
  bladeGrd.addColorStop(0.3, '#E0E0E0');
  bladeGrd.addColorStop(0.6, '#B0B0B0');
  bladeGrd.addColorStop(1, '#909090');
  ctx.fillStyle = bladeGrd;
  ctx.fill();
  ctx.strokeStyle = '#777';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Smudges
  ctx.fillStyle = 'rgba(139, 90, 43, 0.12)';
  ctx.beginPath();
  ctx.ellipse(-15, bladeH * 0.15, 25, 10, 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(20, bladeH * 0.25, 15, 8, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // Ridge
  ctx.strokeStyle = 'rgba(150,150,150,0.4)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, -bladeH / 2 + 5);
  ctx.lineTo(0, bladeH / 2 - 10);
  ctx.stroke();

  ctx.restore();
}

function drawShovelWithWord(cx, cy, word, masked, revealed, isAnswered, time) {
  const font = '"Chalkboard SE", "Comic Sans MS", cursive';
  const wordLen = word.length;
  const bladeW = Math.max(240, wordLen * 50 + 44);
  const bladeH = 72;

  drawShovelBlade(cx, cy, bladeW, bladeH, 0);

  const charWidth = 44;
  const totalW = wordLen * charWidth;
  const startX = cx - totalW / 2 + charWidth / 2;
  const letterY = cy + 2;
  const chars = word.split('');

  for (let i = 0; i < chars.length; i++) {
    const x = startX + i * charWidth;
    const blankPos = masked.indexOf(i);
    const isMasked = blankPos !== -1;

    ctx.font = `bold 40px ${font}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (isMasked && isAnswered) {
      ctx.fillStyle = roundResult === 'correct' ? '#2E7D32' : '#CC3333';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.strokeText(revealed[blankPos], x, letterY);
      ctx.fillText(revealed[blankPos], x, letterY);
    } else if (isMasked) {
      const bounce = Math.sin(time * 6 + blankPos * 1.5) * 3;
      ctx.fillStyle = '#FFD93D';
      ctx.strokeStyle = '#8B6914';
      ctx.lineWidth = 3;
      ctx.strokeText('?', x, letterY + bounce);
      ctx.fillText('?', x, letterY + bounce);
    } else {
      ctx.fillStyle = '#444';
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 2;
      ctx.strokeText(chars[i], x, letterY);
      ctx.fillText(chars[i], x, letterY);
    }
  }

  if (state === STATE.PLAYING && !isAnswered && !digAnim) {
    ctx.font = `18px ${font}`;
    ctx.fillStyle = '#FFD93D';
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 3;
    ctx.textAlign = 'center';
    ctx.strokeText('Pick the right carrot!', cx, cy + bladeH / 2 + 20);
    ctx.fillText('Pick the right carrot!', cx, cy + bladeH / 2 + 20);
  }
}

// Action shovel for dig animation
function drawActionShovel(cx, cy, angle, letter, showLetter) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);

  const bw = 60, bh = 44;

  ctx.strokeStyle = '#8B6914';
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -bh / 2);
  ctx.lineTo(0, -bh / 2 - 80);
  ctx.stroke();
  ctx.strokeStyle = '#A0802A';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(2, -bh / 2 - 5);
  ctx.lineTo(2, -bh / 2 - 75);
  ctx.stroke();

  ctx.fillStyle = '#999';
  ctx.beginPath();
  roundRect(-11, -bh / 2 - 4, 22, 9, 2);
  ctx.fillStyle = '#999';
  ctx.fill();

  const topW = bw / 2;
  const botW = bw / 2 - 6;
  ctx.beginPath();
  ctx.moveTo(-topW, -bh / 2);
  ctx.lineTo(topW, -bh / 2);
  ctx.lineTo(botW, bh / 2 - 8);
  ctx.quadraticCurveTo(botW, bh / 2, botW - 10, bh / 2);
  ctx.lineTo(-botW + 10, bh / 2);
  ctx.quadraticCurveTo(-botW, bh / 2, -botW, bh / 2 - 8);
  ctx.closePath();

  const grd = ctx.createLinearGradient(0, -bh / 2, 0, bh / 2);
  grd.addColorStop(0, '#C0C0C0');
  grd.addColorStop(0.5, '#D8D8D8');
  grd.addColorStop(1, '#909090');
  ctx.fillStyle = grd;
  ctx.fill();
  ctx.strokeStyle = '#777';
  ctx.lineWidth = 2;
  ctx.stroke();

  if (showLetter && letter) {
    const fs = letter.length > 4 ? 12 : letter.length > 3 ? 15 : letter.length > 1 ? 20 : 28;
    ctx.font = `bold ${fs}px "Chalkboard SE", "Comic Sans MS", cursive`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#FF8C42';
    ctx.strokeStyle = '#CC6020';
    ctx.lineWidth = 3;
    ctx.strokeText(letter, 0, 5);
    ctx.fillText(letter, 0, 5);
  }

  ctx.restore();
}

// ============================================================
// CARROT DRAWING (larger for touch)
// ============================================================
function drawCarrot(carrot, time) {
  const { x, y, letters, state: cState, animTime, hovered } = carrot;
  if (cState === 'hidden' || cState === 'scooped') return;

  const cx = x;
  let cy = y;
  let scaleF = 1;
  let shakeX = 0;
  let alpha = 1;

  if (cState === 'pulling') {
    const t = Math.min(animTime / 0.5, 1);
    cy = y - t * 140;
    alpha = 1 - t * 0.5;
    scaleF = 1 + t * 0.2;
  } else if (cState === 'shaking') {
    const t = animTime;
    shakeX = Math.sin(t * 40) * 10 * Math.max(0, 1 - t / 0.5);
  }

  if (hovered && cState === 'idle') {
    scaleF = 1.12;
  }

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx + shakeX, cy);
  ctx.scale(scaleF, scaleF);

  const isRotten = cState === 'rotting';
  const bodyColor = isRotten ? '#8B6914' : '#FF8C42';
  const bodyHighlight = isRotten ? '#7A5B10' : '#FFA559';
  const leafColor = isRotten ? '#6B7B3A' : '#4CAF50';
  const leafHighlight = isRotten ? '#5A6A30' : '#66BB6A';

  // Leaves
  drawLeaves(0, -42, leafColor, leafHighlight, isRotten);

  // Body (slightly larger)
  ctx.beginPath();
  ctx.moveTo(-26, -24);
  ctx.bezierCurveTo(-28, 12, -18, 58, -4, 88);
  ctx.bezierCurveTo(0, 94, 0, 94, 4, 88);
  ctx.bezierCurveTo(18, 58, 28, 12, 26, -24);
  ctx.closePath();

  const bodyGrd = ctx.createLinearGradient(-26, -24, 26, -24);
  bodyGrd.addColorStop(0, bodyColor);
  bodyGrd.addColorStop(0.4, bodyHighlight);
  bodyGrd.addColorStop(1, bodyColor);
  ctx.fillStyle = bodyGrd;
  ctx.fill();
  ctx.strokeStyle = isRotten ? '#5A4010' : '#E07830';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Lines
  ctx.strokeStyle = isRotten ? 'rgba(80,60,10,0.3)' : 'rgba(200,100,30,0.3)';
  ctx.lineWidth = 1.5;
  for (let ly = 0; ly < 60; ly += 18) {
    const w = 22 - ly * 0.25;
    ctx.beginPath();
    ctx.moveTo(-w, ly);
    ctx.lineTo(w, ly);
    ctx.stroke();
  }

  // Face
  if (isRotten) {
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    [-10, 10].forEach(ex => {
      ctx.beginPath();
      ctx.moveTo(ex - 5, 2); ctx.lineTo(ex + 5, 12);
      ctx.moveTo(ex + 5, 2); ctx.lineTo(ex - 5, 12);
      ctx.stroke();
    });
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 30, 7, Math.PI, 0);
    ctx.stroke();
  } else if (cState === 'shaking') {
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.ellipse(-10, 7, 5, 6, 0, 0, Math.PI * 2);
    ctx.ellipse(10, 7, 5, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 26, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#333';
    ctx.fill();
  } else {
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(-10, 7, 4, 0, Math.PI * 2);
    ctx.arc(10, 7, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-8, 5, 2, 0, Math.PI * 2);
    ctx.arc(12, 5, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 22, 8, 0.1, Math.PI - 0.1);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,120,80,0.3)';
    ctx.beginPath();
    ctx.ellipse(-17, 19, 6, 4, 0, 0, Math.PI * 2);
    ctx.ellipse(17, 19, 6, 4, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Letters (horizontal)
  const label = carrot.displayLetters || letters || '';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = isRotten ? '#5A4010' : '#CC6020';
  ctx.lineWidth = 3;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const fontSize = label.length > 4 ? 17 : label.length > 3 ? 20 : label.length > 1 ? 24 : 32;
  ctx.font = `bold ${fontSize}px "Chalkboard SE", "Comic Sans MS", cursive`;
  ctx.strokeText(label, 0, 52);
  ctx.fillText(label, 0, 52);

  ctx.restore();
}

function drawLeaves(x, y, color, highlight, wilted) {
  const droop = wilted ? 0.3 : 0;
  ctx.fillStyle = highlight;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.bezierCurveTo(x - 5, y - 24 + droop * 24, x + 5, y - 30 + droop * 18, x, y - 36 + droop * 30);
  ctx.bezierCurveTo(x + 5, y - 30 + droop * 18, x + 5, y - 24 + droop * 24, x, y);
  ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.bezierCurveTo(x - 18, y - 12 + droop * 18, x - 24, y - 24 + droop * 24, x - 14, y - 34 + droop * 30);
  ctx.bezierCurveTo(x - 10, y - 22 + droop * 18, x - 6, y - 12, x, y);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.bezierCurveTo(x + 18, y - 12 + droop * 18, x + 24, y - 24 + droop * 24, x + 14, y - 34 + droop * 30);
  ctx.bezierCurveTo(x + 10, y - 22 + droop * 18, x + 6, y - 12, x, y);
  ctx.fill();
}

// ============================================================
// GAME LOGIC
// ============================================================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame() {
  sfxStart();
  score = 0;
  round = 0;
  wordOrder = shuffle(CONFIG.WORDS).slice(0, CONFIG.ROUNDS);
  startRound();
}

function startRound() {
  round++;
  currentWord = wordOrder[round - 1];
  digAnim = null;

  const indices = [];
  for (let i = 0; i < currentWord.length; i++) indices.push(i);
  const shuffledIndices = shuffle(indices);
  maskedIndices = shuffledIndices.slice(0, CONFIG.MASKS_PER_WORD).sort((a, b) => a - b);
  revealedLetters = [];
  correctLetters = maskedIndices.map(i => currentWord[i]).join('');
  answered = false;

  generateCarrots();
  roundTimer = CONFIG.ROUND_TIME;
  lastTickAt = -1;
  state = STATE.PLAYING;
  roundResult = '';
}

function formatCarrotLabel(rawLetters) {
  let label = '';
  for (let i = 0; i < rawLetters.length; i++) {
    if (i > 0 && maskedIndices[i] - maskedIndices[i - 1] > 1) {
      label += '..';
    }
    label += rawLetters[i];
  }
  return label;
}

function generateCarrots() {
  const numLetters = correctLetters.length;
  const usedCombos = new Set([correctLetters]);
  const distractors = [];

  while (distractors.length < CONFIG.CARROTS_PER_ROUND - 1) {
    let combo = '';
    for (let j = 0; j < numLetters; j++) {
      combo += CONFIG.ALL_LETTERS[Math.floor(Math.random() * 26)];
    }
    if (!usedCombos.has(combo)) {
      usedCombos.add(combo);
      distractors.push(combo);
    }
  }

  const combos = shuffle([correctLetters, ...distractors]);
  const spacing = 200;
  const startX = CONFIG.W / 2 - (spacing * (CONFIG.CARROTS_PER_ROUND - 1)) / 2;

  carrots = combos.map((letters, i) => ({
    x: startX + i * spacing,
    y: CARROT_Y,
    letters,
    displayLetters: formatCarrotLabel(letters),
    state: 'idle',
    animTime: 0,
    hovered: false,
    correct: letters === correctLetters
  }));
}

function handleCarrotClick(index) {
  if (state !== STATE.PLAYING) return;
  if (digAnim) return;
  const carrot = carrots[index];
  if (carrot.state !== 'idle') return;

  if (carrot.correct) {
    revealedLetters = correctLetters.split('');
    answered = true;
    sfxPull();

    carrot.state = 'scooped';
    digAnim = {
      phase: 'swing_down',
      time: 0,
      carrotIndex: index,
      startX: SHOVEL_REST_X,
      startY: SHOVEL_REST_Y + 35,
      targetX: carrot.x,
      targetY: carrot.y - 24,
      shovelX: SHOVEL_REST_X,
      shovelY: SHOVEL_REST_Y + 35,
      shovelAngle: 0,
      carrotLetters: formatCarrotLabel(correctLetters),
      carrotDrawX: carrot.x,
      carrotDrawY: carrot.y
    };
  } else {
    carrot.state = 'shaking';
    carrot.animTime = 0;
    sfxWrong();
    setTimeout(() => {
      if (carrot.state === 'shaking') carrot.state = 'idle';
    }, 500);
  }
}

function endRound() {
  state = STATE.ROUND_RESULT;
  resultTimer = CONFIG.RESULT_PAUSE;
}

function timeoutRound() {
  roundResult = 'timeout';
  sfxTimeout();
  revealedLetters = correctLetters.split('');
  answered = true;
  speakWord(currentWord);
  carrots.forEach(c => {
    if (c.state === 'idle') {
      c.state = 'rotting';
      c.animTime = 0;
    }
  });
  endRound();
}

// ============================================================
// DIG ANIMATION
// ============================================================
function spawnDirtParticles(x, y, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x + (Math.random() - 0.5) * 35,
      y: y,
      vx: (Math.random() - 0.5) * 200,
      vy: -70 - Math.random() * 150,
      life: 0.4 + Math.random() * 0.5,
      maxLife: 0.4 + Math.random() * 0.5,
      color: ['#8B6914','#A0724A','#6B3F23','#C4A265'][Math.floor(Math.random() * 4)],
      size: 4 + Math.random() * 7,
      isDirt: true
    });
  }
}

function spawnSparkles(x, y, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 220,
      vy: -120 - Math.random() * 170,
      life: 0.6 + Math.random() * 0.6,
      maxLife: 0.6 + Math.random() * 0.6,
      color: ['#FFD700','#FF6B6B','#4ECDC4','#FFE66D','#FF8C42'][Math.floor(Math.random() * 5)],
      size: 4 + Math.random() * 6,
      isDirt: false
    });
  }
}

function updateDigAnim(dt) {
  if (!digAnim) return;
  digAnim.time += dt;
  const a = digAnim;

  if (a.phase === 'swing_down') {
    const dur = 0.3;
    const t = Math.min(a.time / dur, 1);
    const ease = t * t;
    a.shovelX = a.startX + (a.targetX - a.startX) * ease;
    a.shovelY = a.startY + (a.targetY - a.startY) * ease;
    a.shovelY -= Math.sin(t * Math.PI) * 60;
    a.shovelAngle = ease * 0.6;
    if (t >= 1) {
      a.phase = 'scoop';
      a.time = 0;
      spawnDirtParticles(a.targetX, a.targetY + 24, 20);
      sfxDig();
    }
  } else if (a.phase === 'scoop') {
    const dur = 0.2;
    const t = Math.min(a.time / dur, 1);
    a.shovelAngle = 0.6 + t * 0.2;
    a.shovelY = a.targetY + t * 18;
    if (t >= 1) {
      a.phase = 'fly_up';
      a.time = 0;
      a.carrotDrawX = a.shovelX;
      a.carrotDrawY = a.shovelY + 35;
    }
  } else if (a.phase === 'fly_up') {
    const dur = 0.45;
    const t = Math.min(a.time / dur, 1);
    const ease = 1 - (1 - t) * (1 - t);
    a.shovelX = a.targetX + (a.startX - a.targetX) * ease;
    a.shovelY = (a.targetY + 18) + (a.startY - a.targetY - 18) * ease;
    a.shovelY -= Math.sin(t * Math.PI) * 80;
    a.shovelAngle = 0.8 * (1 - ease);
    a.carrotDrawX = a.shovelX;
    a.carrotDrawY = a.shovelY + 40;
    if (Math.random() < 0.4) {
      spawnDirtParticles(a.shovelX, a.shovelY + 35, 1);
    }
    if (t >= 1) {
      digAnim = null;
      spawnSparkles(a.startX, a.startY, 18);
      score++;
      roundResult = 'correct';
      setTimeout(sfxCorrect, 100);
      speakWord(currentWord);
      endRound();
    }
  }
}

function drawDigAnim() {
  if (!digAnim) return;
  const a = digAnim;

  if (a.phase === 'fly_up') {
    drawCarrot({
      x: a.carrotDrawX,
      y: a.carrotDrawY,
      letters: a.carrotLetters,
      displayLetters: a.carrotLetters,
      state: 'idle',
      animTime: 0,
      hovered: false
    }, totalTime);
  }

  drawActionShovel(a.shovelX, a.shovelY, a.shovelAngle,
    a.carrotLetters, a.phase === 'fly_up');
}

// ============================================================
// PARTICLES
// ============================================================
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 300 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    const s = p.size * alpha;
    if (p.isDirt) {
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, s * 1.2, s * 0.8, p.vx * 0.01, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
        const method = i === 0 ? 'moveTo' : 'lineTo';
        ctx[method](p.x + Math.cos(a) * s, p.y + Math.sin(a) * s);
        const a2 = a + (2 * Math.PI) / 10;
        ctx.lineTo(p.x + Math.cos(a2) * s * 0.4, p.y + Math.sin(a2) * s * 0.4);
      }
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  });
}

// ============================================================
// UPDATE & RENDER
// ============================================================
let lastTime = 0;
let totalTime = 0;

function update(dt) {
  totalTime += dt;

  if (state === STATE.PLAYING) {
    if (!digAnim) roundTimer -= dt;
    if (roundTimer <= 3 && roundTimer > 0) {
      const sec = Math.ceil(roundTimer);
      if (sec !== lastTickAt) { lastTickAt = sec; sfxTick(); }
    }
    if (roundTimer <= 0 && !digAnim) { roundTimer = 0; timeoutRound(); }
    carrots.forEach(c => {
      if (c.state === 'pulling' || c.state === 'shaking' || c.state === 'rotting') c.animTime += dt;
    });
    updateDigAnim(dt);
  }

  if (state === STATE.ROUND_RESULT) {
    resultTimer -= dt;
    carrots.forEach(c => {
      if (c.state === 'pulling' || c.state === 'shaking' || c.state === 'rotting') c.animTime += dt;
    });
    if (resultTimer <= 0) {
      if (round >= CONFIG.ROUNDS) { state = STATE.GAME_OVER; sfxGameOver(); spawnRibbons(); }
      else startRound();
    }
  }

  updateParticles(dt);
  if (state === STATE.GAME_OVER) updateRibbons(dt);
}

function draw() {
  ctx.clearRect(0, 0, CONFIG.W, CONFIG.H);

  if (state === STATE.TITLE) { drawTitleScreen(totalTime); return; }
  if (state === STATE.GAME_OVER) { drawGameOverScreen(totalTime); drawParticles(); return; }

  ctx.drawImage(bgCanvas, 0, 0);
  drawSun(130, 110, 48);
  clouds.forEach(c => drawCloud(c.x + Math.sin(totalTime * 0.3 + c.y) * 12, c.y, c.w));

  carrots.forEach((c, i) => {
    c.hovered = (i === hoveredCarrot) && state === STATE.PLAYING && !digAnim;
    drawCarrot(c, totalTime);
  });

  drawDigAnim();
  drawHUD();

  if (state === STATE.ROUND_RESULT) {
    const font = '"Chalkboard SE", "Comic Sans MS", cursive';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `bold 40px ${font}`;

    if (roundResult === 'correct') {
      ctx.fillStyle = '#4CAF50';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4;
      ctx.strokeText(`Yes! ${currentWord}!`, CONFIG.W / 2, 370);
      ctx.fillText(`Yes! ${currentWord}!`, CONFIG.W / 2, 370);
    } else if (roundResult === 'timeout') {
      ctx.fillStyle = '#FF6B6B';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4;
      ctx.strokeText(`Time's up! It was ${currentWord}`, CONFIG.W / 2, 370);
      ctx.fillText(`Time's up! It was ${currentWord}`, CONFIG.W / 2, 370);
    }
  }

  drawParticles();
}

function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

// ============================================================
// INPUT (Touch-first for iPad, with mouse fallback)
// ============================================================
// Touch hitbox is larger than mouse for fat fingers
const TOUCH_HIT_W = 50;
const TOUCH_HIT_TOP = 60;
const TOUCH_HIT_BOT = 110;

function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  if (e.touches && e.touches.length > 0) {
    return {
      x: (e.touches[0].clientX - rect.left) / scale,
      y: (e.touches[0].clientY - rect.top) / scale
    };
  }
  return {
    x: (e.clientX - rect.left) / scale,
    y: (e.clientY - rect.top) / scale
  };
}

function getCanvasPosFromChanged(e) {
  const rect = canvas.getBoundingClientRect();
  if (e.changedTouches && e.changedTouches.length > 0) {
    return {
      x: (e.changedTouches[0].clientX - rect.left) / scale,
      y: (e.changedTouches[0].clientY - rect.top) / scale
    };
  }
  return getCanvasPos(e);
}

function hitTestCarrot(pos) {
  for (let i = 0; i < carrots.length; i++) {
    const c = carrots[i];
    if (c.state === 'idle' &&
        pos.x > c.x - TOUCH_HIT_W && pos.x < c.x + TOUCH_HIT_W &&
        pos.y > c.y - TOUCH_HIT_TOP && pos.y < c.y + TOUCH_HIT_BOT) {
      return i;
    }
  }
  return -1;
}

// Touch events (primary for iPad)
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  ensureAudio();
  const pos = getCanvasPos(e);

  if (state === STATE.TITLE) { startGame(); return; }
  if (state === STATE.GAME_OVER) { state = STATE.TITLE; return; }

  if (state === STATE.PLAYING && !digAnim) {
    const idx = hitTestCarrot(pos);
    if (idx >= 0) {
      hoveredCarrot = idx;
      handleCarrotClick(idx);
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (state !== STATE.PLAYING || digAnim) { hoveredCarrot = -1; return; }
  const pos = getCanvasPos(e);
  hoveredCarrot = hitTestCarrot(pos);
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  hoveredCarrot = -1;
}, { passive: false });

// Mouse fallback
canvas.addEventListener('mousemove', (e) => {
  if (state !== STATE.PLAYING || digAnim) { hoveredCarrot = -1; canvas.style.cursor = 'default'; return; }
  const pos = getCanvasPos(e);
  hoveredCarrot = hitTestCarrot(pos);
  canvas.style.cursor = hoveredCarrot >= 0 ? 'pointer' : 'default';
});

canvas.addEventListener('click', (e) => {
  ensureAudio();
  const pos = getCanvasPos(e);

  if (state === STATE.TITLE) { startGame(); return; }
  if (state === STATE.GAME_OVER) { state = STATE.TITLE; return; }

  if (state === STATE.PLAYING && !digAnim) {
    const idx = hitTestCarrot(pos);
    if (idx >= 0) handleCarrotClick(idx);
  }
});

// Prevent iOS rubber-banding / pull-to-refresh
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

// ============================================================
// BOOT
// ============================================================
renderBackground();
requestAnimationFrame((t) => {
  lastTime = t;
  gameLoop(t);
});
</script>
</body>
</html>
